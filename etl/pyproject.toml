[project]
name = "etl"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "pdfplumber>=0.11", "pypdf>=4.2"]

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true

[tool.ruff]
line-length = 100
